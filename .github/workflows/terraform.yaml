name: Terraform Azure Infrastructure

on:
  push:
    branches:
      - main
      - "feature/**"

jobs:

  terraform-plan:
    name: Terraform Plan
    if: github.ref != 'refs/heads/main'
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./ParentModule/Prod

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Terraform Version
        run: terraform version

      - name: Check Azure CLI
        run: az version

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan


  terraform-apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./ParentModule/Prod

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Terraform Version
        run: terraform version

      - name: Check Azure CLI
        run: az version

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve